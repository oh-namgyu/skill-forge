name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Standard-library only and platform independent, so one runner covers
        # it; the matrix exists to hold the 3.9 floor and the 3.12 ceiling.
        os: [ubuntu-latest]
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Compile
        run: python -m compileall -q skill_forge

      - name: Test
        # There is no package to install: `python -m pytest` puts the checkout
        # root on sys.path, which is how `skill_forge` is imported.
        run: python -m pytest tests/ -q

      - name: Smoke the entry point
        run: python -m skill_forge --help
